syntax = "proto3";

package inference;

// The request message containing the image bytes
message PredictRequest {
  bytes image_data = 1;
}

// The response message containing prediction results
message PredictResponse {
  int32 class_id = 1;
  float confidence = 2;
  string label = 3;
}

// The service definition
service ModelInference {
  rpc Predict (PredictRequest) returns (PredictResponse) {}
}