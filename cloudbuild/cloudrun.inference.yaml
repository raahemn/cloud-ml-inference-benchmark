# Cloud Run inference pipeline
# This pipeline does the full cloud-side flow for the `cloudrun` variant:
# 1. build coordinator image
# 2. push coordinator image
# 3. build gRPC model image
# 4. push gRPC model image
# 5. build training service image
# 6. push training service image
# 7. initialize Terraform
# 8. apply Terraform for Cloud Run + load balancer resources

substitutions:
  # Region where Cloud Run services and Artifact Registry live.
  _REGION: northamerica-northeast1
  _ARTIFACT_REGISTRY_LOCATION: northamerica-northeast1

  # Artifact Registry repository that stores both service images.
  _ARTIFACT_REPOSITORY: inference-cloudrun-images

  # Terraform directory for the Cloud Run inference variant.
  _TF_DIR: infra/inference/cloudrun

  # Remote Terraform state location for repeatable Cloud Build deploys.
  _TF_STATE_BUCKET: inference-cloudrun-tfstate-254882982092
  _TF_STATE_PREFIX: infra/inference/cloudrun

  # Shared model bucket that the training service reads from and writes to.
  _MODEL_BUCKET_NAME: cmpt756-resnet-models

  # Minimum number of labeled samples required before training starts.
  _TRAINING_THRESHOLD: "100"

steps:
  # Step 1: Build the Rust coordinator image.
  - name: gcr.io/cloud-builders/docker
    id: build-coordinator-image
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:${BUILD_ID}
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:latest
      - ./coordinator

  # Step 2: Push the immutable coordinator image for this commit.
  - name: gcr.io/cloud-builders/docker
    id: push-coordinator-image-sha
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:${BUILD_ID}

  # Step 3: Push the rolling `latest` coordinator image.
  - name: gcr.io/cloud-builders/docker
    id: push-coordinator-image-latest
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:latest

  # Step 4: Build the Python gRPC model service image.
  - name: gcr.io/cloud-builders/docker
    id: build-grpc-model-image
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:${BUILD_ID}
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:latest
      - ./ml-grpc-service

  # Step 5: Push the immutable gRPC model image for this commit.
  - name: gcr.io/cloud-builders/docker
    id: push-grpc-model-image-sha
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:${BUILD_ID}

  # Step 6: Push the rolling `latest` gRPC model image.
  - name: gcr.io/cloud-builders/docker
    id: push-grpc-model-image-latest
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:latest

  # Step 7: Build the training service image.
  - name: gcr.io/cloud-builders/docker
    id: build-training-service-image
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:${BUILD_ID}
      - -t
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:latest
      - ./training-service

  # Step 8: Push the immutable training service image for this commit.
  - name: gcr.io/cloud-builders/docker
    id: push-training-service-image-sha
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:${BUILD_ID}

  # Step 9: Push the rolling `latest` training service image.
  - name: gcr.io/cloud-builders/docker
    id: push-training-service-image-latest
    args:
      - push
      - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:latest

  # Step 10: Initialize Terraform in the Cloud Run inference directory.
  - name: hashicorp/terraform:1.7.5
    id: terraform-init
    dir: ${_TF_DIR}
    entrypoint: sh
    args:
      - -c
      - |
        terraform init \
          -backend-config="bucket=${_TF_STATE_BUCKET}" \
          -backend-config="prefix=${_TF_STATE_PREFIX}"

  # Step 11: Apply Terraform using the images built in this pipeline run.
  # This deploys:
  # - inference-cloudrun-coordinator
  # - inference-cloudrun-grpc-model
  # - inference-cloudrun-training-service
  # - shared Pub/Sub trigger resources for training
  # - shared training bucket wiring used by coordinator and training service
  # - load balancer resources in front of the coordinator
  - name: hashicorp/terraform:1.7.5
    id: terraform-apply
    dir: ${_TF_DIR}
    entrypoint: sh
    args:
      - -c
      - |
        terraform apply -auto-approve \
          -var="project_id=$PROJECT_ID" \
          -var="region=${_REGION}" \
          -var="artifact_registry_location=${_ARTIFACT_REGISTRY_LOCATION}" \
          -var="coordinator_image=${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:${BUILD_ID}" \
          -var="grpc_model_image=${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:${BUILD_ID}" \
          -var="training_service_image=${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:${BUILD_ID}" \
          -var="model_bucket_name=${_MODEL_BUCKET_NAME}" \
          -var="training_threshold=${_TRAINING_THRESHOLD}"

# Images recorded as build outputs for this run.
images:
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:${BUILD_ID}
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/coordinator:latest
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:${BUILD_ID}
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/grpc-model:latest
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:${BUILD_ID}
  - ${_ARTIFACT_REGISTRY_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/training-service:latest
